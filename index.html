<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE">
<title>Dastarkhan · Family Food Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dastarkhan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EE; --card:#FFFFFF; --ink:#1D2320; --ink-2:#3C4440; --muted:#7A817C; --line:#ECE6DC; --line-2:#F2EEE7;
  --brand:#2D5B4C; --brand-ink:#FFFFFF; --brand-soft:#E5EEE9; --accent:#D27D2C; --accent-soft:#FBEBDC;
  --ok:#3E8C5A; --ok-soft:#E3F1E7; --warn:#C98A12; --warn-soft:#FBF1D9; --bad:#BF4A3E; --bad-soft:#F9E3E0;
  --r:18px; --r-sm:12px; --shadow:0 1px 2px rgba(29,35,32,.04),0 6px 24px rgba(29,35,32,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --display:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141816; --card:#1C211F; --ink:#ECEFEC; --ink-2:#C9CFCB; --muted:#8E9792; --line:#2A302D; --line-2:#232825;
  --brand:#7FB8A2; --brand-ink:#0F1513; --brand-soft:#21302A; --accent:#E39A55; --accent-soft:#33261A;
  --ok:#78C08F; --ok-soft:#1F3125; --warn:#E2B04E; --warn-soft:#332A16; --bad:#E27A6E; --bad-soft:#3A2220;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}}
html[lang^="fa"]{--font:'Vazirmatn',system-ui,sans-serif; --display:'Vazirmatn',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(96px + env(safe-area-inset-bottom))}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 2px 14px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--display);font-size:19px;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang button{padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--ink);color:var(--bg)}
/* type */
h1{font-family:var(--display);font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:2px 0 4px;font-weight:600}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px}
html[lang^="fa"] h2{letter-spacing:0;font-size:14px}
.sub{color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line-2)}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.strong{font-weight:600}
/* meals strip */
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meal{background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:var(--r);padding:12px;text-align:start;display:flex;flex-direction:column;gap:8px;min-height:150px;transition:transform .15s}
.meal:active{transform:scale(.98)}
.meal .lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
html[lang^="fa"] .meal .lbl{letter-spacing:0;font-size:12.5px}
.meal .nm{font-weight:600;font-size:14px;line-height:1.3;flex:1}
.meal .meta{font-size:12px;color:var(--muted)}
.meal.empty{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;color:var(--muted)}
@media(max-width:380px){.meals{grid-template-columns:1fr}.meal{min-height:auto;flex-direction:row;align-items:center}.meal .nm{flex:1}}
/* tiles */
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.tile svg{width:24px;height:24px}
.tile.sm{width:36px;height:36px;border-radius:11px}.tile.sm svg{width:20px;height:20px}
.tile.xs{width:28px;height:28px;border-radius:8px}.tile.xs svg{width:16px;height:16px}
.tile.lg{width:64px;height:64px;border-radius:18px}.tile.lg svg{width:34px;height:34px}
/* budget */
.big{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
html[lang^="fa"] .big{font-size:28px}
.bar{height:10px;background:var(--line-2);border-radius:99px;overflow:hidden;position:relative;margin:14px 0 8px}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--ok);transition:width .5s}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar .mark{position:absolute;inset-block:-3px;width:2px;background:var(--ink);opacity:.5}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brand{background:var(--brand-soft);color:var(--brand)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
/* rings */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ring{position:relative;width:84px;height:84px;margin:0 auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:16px}
.ring-l{font-size:13px;font-weight:600}.ring-s{font-size:11.5px;color:var(--muted)}
/* insights */
.ins{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.ins:first-child{border-top:0;padding-top:2px}.ins:last-child{padding-bottom:0}
.ins .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}
.ins p{margin:0;font-size:14px}
.ins small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.ghost{background:transparent;box-shadow:none}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--line-2)}
/* week */
.day{padding:6px 6px 6px 14px}
html[dir=rtl] .day{padding:6px 14px 6px 6px}
.day-h{display:flex;align-items:center;gap:8px;padding:8px 6px 6px 0}
.day-h b{font-size:15px}
.today-tag{font-size:11px;font-weight:700;color:var(--brand-ink);background:var(--brand);padding:2px 8px;border-radius:99px}
.slot{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:12px;text-align:start}
.slot:hover{background:var(--line-2)}
.slot .sl{width:74px;flex:none;font-size:12px;color:var(--muted);font-weight:600}
.slot .sn{flex:1;min-width:0;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sc{font-size:12.5px;color:var(--muted)}
.slot.add .sn{color:var(--brand);font-weight:600}
.left-tag{font-size:11px;color:var(--accent);font-weight:600;display:block}
/* summary strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-2);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line-2)}
.strip div{background:var(--card);padding:12px 14px}
.strip b{display:block;font-size:17px;font-weight:700}
.strip span{font-size:12px;color:var(--muted)}
/* shop */
.shop-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line-2);width:100%;text-align:start}
.shop-item:first-of-type{border-top:0}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.15s}
.chk svg{width:14px;height:14px;opacity:0}
.done .chk{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.done .chk svg{opacity:1}
.done .nm{text-decoration:line-through;color:var(--muted)}
.shop-item .q{font-weight:600;font-size:14px;white-space:nowrap}
.shop-item .c{font-size:12.5px;color:var(--muted);min-width:62px;text-align:end}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px}
.cat-h b{font-size:14px}
/* recipes */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:transparent;flex:1;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:420px){.rgrid{grid-template-columns:1fr}}
.rcard{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;text-align:start;display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.rcard:active{transform:scale(.985)}
.rcard .nm{font-weight:600;font-size:14.5px;line-height:1.3}
.rcard .tags{display:flex;gap:6px;flex-wrap:wrap}
/* family */
.mem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2);width:100%;text-align:start}
.mem:first-child{border-top:0;padding-top:0}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.field:first-child{border-top:0;padding-top:0}
.field label{font-size:14px}
.field small{display:block;color:var(--muted);font-size:12px}
.inp{height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;width:110px;text-align:end;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp.w{width:100%;text-align:start}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}.switch i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}.switch.on{background:var(--brand)}.switch.on i{inset-inline-start:21px}
.seg{display:flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:10px}
/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;pointer-events:auto}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:16px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand);background:var(--brand-soft)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,20,18,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden;padding:8px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 6px}
.sheet h3{font-family:var(--display);font-size:22px;margin:0;line-height:1.2;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border-radius:12px;text-align:start;border-top:1px solid var(--line-2)}
.opt:hover{background:var(--line-2)}
.opt.cur{background:var(--brand-soft)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--line-2);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:15px}
.stats span{font-size:11.5px;color:var(--muted)}
.ing{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line-2);font-size:14px}
.tip{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;margin:14px 0;display:flex;gap:10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty-state{text-align:center;padding:30px 10px;color:var(--muted)}
textarea.copy{width:100%;height:220px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);font:13px/1.5 var(--font)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 8c0-1.5 1-1.5 1-3M12 8c0-1.5 1-1.5 1-3M16 8c0-1.5 1-1.5 1-3"/></svg></div>
    <div class="brand"><b id="appName">Dastarkhan</b><span id="sync" class="sync"><i class="dot"></i><em id="syncT" style="font-style:normal"></em></span></div>
    <div class="lang" role="group" aria-label="Language"><button data-act="lang" data-v="en">EN</button><button data-act="lang" data-v="fa">دری</button></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== CORE: data + pure logic (no DOM) ===== */
// Ingredient catalogue. price = Rs per unit (Lahore retail, Nov 2026 – editable in app).
// n = nutrition per unit: [kcal, protein g, fibre g]
const ING = {
  atta:    {en:'Wheat flour (atta)', fa:'آرد گندم (آته)', u:'kg', p:150, c:'grain', n:[3400,120,110]},
  rice:    {en:'Rice (sella)', fa:'برنج', u:'kg', p:380, c:'grain', n:[3600,70,10]},
  daliya:  {en:'Daliya (cracked wheat)', fa:'دلیه', u:'kg', p:220, c:'grain', n:[3400,120,120]},
  wheat:   {en:'Wheat grain (gandum)', fa:'گندم (دانه)', u:'kg', p:100, c:'grain', n:[3400,120,120]},
  naan:    {en:'Tandoor naan (bought)', fa:'نان تندوری (خریداری)', u:'pc', p:30, c:'grain', n:[300,9,3]},
  lobia:   {en:'Kidney beans (lobia)', fa:'لوبیا', u:'kg', p:400, c:'pulse', n:[3330,240,150]},
  masoor:  {en:'Red lentils (masoor)', fa:'دال نسک', u:'kg', p:320, c:'pulse', n:[3500,250,110]},
  moong:   {en:'Mung beans (moong)', fa:'ماش', u:'kg', p:350, c:'pulse', n:[3470,240,160]},
  chana:   {en:'Chickpeas (white chana)', fa:'نخود', u:'kg', p:380, c:'pulse', n:[3640,190,170]},
  chicken: {en:'Chicken (with bone)', fa:'گوشت مرغ', u:'kg', p:650, c:'meat', n:[1500,180,0]},
  mutton:  {en:'Mutton (with bone)', fa:'گوشت گوسفند', u:'kg', p:2400, c:'meat', n:[2000,180,0]},
  beef:    {en:'Beef mince (qeema)', fa:'قیمهٔ گوشت گاو', u:'kg', p:1500, c:'meat', n:[2200,260,0]},
  egg:     {en:'Eggs', fa:'تخم مرغ', u:'pc', p:25, c:'meat', n:[72,6.3,0]},
  milk:    {en:'Milk', fa:'شیر', u:'L', p:230, c:'dairy', n:[650,33,0]},
  yogurt:  {en:'Yogurt', fa:'ماست', u:'kg', p:250, c:'dairy', n:[600,35,0]},
  oil:     {en:'Cooking oil', fa:'روغن', u:'L', p:520, c:'pantry', n:[8280,0,0]},
  onion:   {en:'Onions', fa:'پیاز', u:'kg', p:140, c:'veg', n:[400,11,17]},
  tomato:  {en:'Tomatoes', fa:'بادنجان رومی', u:'kg', p:300, c:'veg', n:[180,9,12]},
  potato:  {en:'Potatoes', fa:'کچالو', u:'kg', p:90, c:'veg', n:[770,20,22]},
  spinach: {en:'Spinach (palak)', fa:'پالک', u:'kg', p:100, c:'veg', n:[230,29,22]},
  cauli:   {en:'Cauliflower', fa:'گلپی', u:'kg', p:150, c:'veg', n:[250,19,20]},
  okra:    {en:'Okra (bhindi)', fa:'بامیه', u:'kg', p:220, c:'veg', n:[330,19,32]},
  carrot:  {en:'Carrots', fa:'زردک', u:'kg', p:150, c:'veg', n:[410,9,28]},
  peas:    {en:'Green peas', fa:'متر (نخود سبز)', u:'kg', p:400, c:'veg', n:[810,54,57]},

  const mo=new Date().getMonth()+1; return (mo>=11||mo<=2)?'winter':(mo>=5&&mo<=9)?'summer':'mild';
}
function inSeason(r,season){ return !r.s || season==='mild' || r.s===season[0]; }
function energyBoost(state){ return currentSeason(state)==='winter' ? ((state.winterBoost??10)/100) : 0; }

  const hid=new Set(state.hiddenR||[]);

  if(state.onlyMine){ const mine=l.filter(r=>r.custom); if(mine.length) l=mine; }

const LEFT_ID='left';
function prevDay(d){ const i=DAYS.findIndex(x=>x[0]===d); return DAYS[(i+6)%7][0]; }
function resolveSlot(state,d,s){
  const id=state.plan[d]&&state.plan[d][s];
  if(!id) return null;
  if(id===LEFT_ID){
    const src=state.plan[prevDay(d)]&&state.plan[prevDay(d)].d;
    const r=src&&RMAP[src]; if(!r) return {left:true, i:[['atta',0.6]], src:null};
    const i=r.i.filter(([k])=>k!=='atta'&&k!=='spice').map(([k,q])=>[k,q*0.6]); i.push(['atta',0.6]);
    return {left:true, i, src:r.id};
  }
  return RMAP[id]||null;
}

// ---- Nutrition targets (US Dietary Guidelines estimates, moderately active) ----
function kcalFor(age, sex, act){
  let k;
  if (age<4) k=1200; else if (age<9) k = sex==='m'?1500:1400;
  else if (age<14) k = sex==='m' ? 1600+(age-9)*150 : [1600,1800,1800,2000,2000][age-9];
  else if (age<19) k = sex==='m' ? Math.min(2800,2400+(age-14)*200) : 2000;
  else if (age<31) k = sex==='m'?2700:2100;
  else if (age<51) k = sex==='m'?2500:2000;
  else if (age<61) k = sex==='m'?2400:1800;
  else k = sex==='m'?2200:1700;
  const f = act==='low'?0.85:act==='high'?1.15:1;
  return Math.round(k*f/50)*50;
}
function proteinFor(age, sex){
  if (age<4) return 13; if (age<9) return 19; if (age<14) return 34;
  if (age<19) return sex==='m'?52:46; return sex==='m'?56:46;
}
function targetOf(m){ const k=kcalFor(m.age,m.sex,m.act); return {k, p:proteinFor(m.age,m.sex), f:Math.round(k/1000*14)}; }
function familyTarget(members, boost=0){
  const t=members.reduce((a,m)=>{const t=targetOf(m);a.k+=t.k;a.p+=t.p;a.f+=t.f;return a;},{k:0,p:0,f:0});
  t.k=Math.round(t.k*(1+boost)/50)*50; return t;
}
// how many "standard adult portions" the family eats, relative to the 5-person recipe base (11,000 kcal)
function scaleFactor(members){ return familyTarget(members).k / 11000; }

function priceOf(state,id){ const v=state.prices&&state.prices[id]; return (v!=null&&!isNaN(v))?+v:ING[id].p; }

function recipeTotals(state, r, scale){
  scale = scale ?? scaleFactor(state.members);
  let cost=0,k=0,p=0,f=0;
  for (const [id,q0] of r.i){ const q=q0*scale, g=ING[id]; cost+=q*priceOf(state,id); k+=q*g.n[0]; p+=q*g.n[1]; f+=q*g.n[2]; }
  return {cost,k,p,f};
}

function basicsList(state){

}
function weekTotals(state){
  const sc=scaleFactor(state.members);
  const T={meals:0,basics:0,k:0,p:0,f:0,filled:0,counts:{}};
  for (const [d] of DAYS) for (const [s] of SLOTS){
    const r=resolveSlot(state,d,s); if(!r) continue;
    const t=recipeTotals(state,r,sc); T.meals+=t.cost; T.k+=t.k; T.p+=t.p; T.f+=t.f; T.filled++;
    if(!r.left) T.counts[r.id]=(T.counts[r.id]||0)+1; else T.left=(T.left||0)+1;
  }
  for (const [id,q] of basicsList(state)){ const g=ING[id]; T.basics+=7*q*priceOf(state,id); T.k+=7*q*g.n[0]; T.p+=7*q*g.n[1]; T.f+=7*q*g.n[2]; }
  T.fruit=0;
  for (const b of (state.basket||[])){ const g=ING[b.id]; if(!g) continue; const q=+b.q||0; T.fruit+=q*priceOf(state,b.id); T.k+=q*g.n[0]; T.p+=q*g.n[1]; T.f+=q*g.n[2]; }
  T.week = T.meals+T.basics+T.fruit;
  T.month = T.week*52/12 + (+state.other||0);
  T.day = {k:T.k/7,p:T.p/7,f:T.f/7};
  return T;
}

  for (const [id,q] of basicsList(state)){ const g=ING[id]; T.cost+=q*priceOf(state,id); T.k+=q*g.n[0]; T.p+=q*g.n[1]; T.f+=q*g.n[2]; }
  for (const b of (state.basket||[])){ const g=ING[b.id]; if(!g) continue; const q=(+b.q||0)/7; T.cost+=q*priceOf(state,b.id); T.k+=q*g.n[0]; T.p+=q*g.n[1]; T.f+=q*g.n[2]; }

// Smart auto-planner: random search for the best week within budget & nutrition targets
function autoPlan(state, seed){
  let s = seed || (Date.now() % 2147483647);
  const rnd=()=> (s = s*16807 % 2147483647) / 2147483647;
  const season=currentSeason(state);
  // in-season dishes are twice as likely to be drawn
  const weight=a=>a.flatMap(r=>inSeason(r,season)?[r,r]:[r]);
  const B=weight(pool(state,'b')), M=weight(pool(state,'m'));
  const pick=a=>a[Math.floor(rnd()*a.length)].id;
  const tgt=familyTarget(state.members, energyBoost(state));
  const budgetWeek = ((+state.budget||0) - (+state.other||0)) * 12/52;
  let best=null, bestScore=Infinity;
  for (let it=0; it<3000; it++){
    const plan={};
    for (const [d] of DAYS){
      const useLeft = rnd() < (state.leftovers??0.6);
      const l= useLeft ? LEFT_ID : pick(M); let dn=pick(M); let g=0; while(dn===l && g++<10) dn=pick(M);
      plan[d]={b:pick(B),l,d:dn};
    }
    const T=weekTotals({...state,plan});
    let sc=0;
    sc += Math.max(0,T.week-budgetWeek*0.97)/50;               // over budget – heavy
    sc += Math.max(0, tgt.p - T.day.p)*0.6;                       // protein shortfall
    sc += Math.max(0, tgt.k*0.97 - T.day.k)/(season==='winter'?30:60); // energy shortfall (stricter in winter)
    for (const d in plan) for (const k of ['b','l','d']){ const r=RMAP[plan[d][k]]; if(r && !inSeason(r,season)) sc+=4; } // out of season
    sc += Math.max(0, tgt.f - T.day.f)*0.3;
    const c=T.counts; for (const k in c) if (c[k]>2) sc += (c[k]-2)*8;   // variety
    let ch=0; for (const k of ['m_karahi','m_shorwa','m_palaw']) ch+=(c[k]||0);
    if (ch>3) sc+=(ch-3)*6;
    if (sc<bestScore){bestScore=sc;best=plan;}
  }
  return best;
}

async function push(){

  saving=true;
  try{ const c=JSON.parse(JSON.stringify(state)); delete c.lang; await docRef.set({state:c}); setSync('on'); }
  catch(e){ if(e&&e.code==='invalid_argument'){docRef=null;setSync('local');} else setSync('local'); }

}

async function initDb(){
  if(!(window.claude&&typeof window.claude.use==='function')){setSync('local');return;}
  let timer=setTimeout(()=>{ if(syncMode==='connecting') setSync('local'); },10000);
  try{
    db = await window.claude.use('db');
    if(!db){clearTimeout(timer);setSync('local');return;}
    docRef = db.doc('home/state'); let first=true;
    docRef.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.fromCache&&!snap.exists) return;
      clearTimeout(timer);
      if(snap.exists){
        const remote=snap.data().state;
        if(remote && (remote.updatedAt||0) > (state.updatedAt||0)){ const lang=state.lang; state=normalize(JSON.parse(JSON.stringify(remote))); state.lang=lang; saveLocal(); render(); }
        else if(first && (state.updatedAt||0) > (remote&&remote.updatedAt||0)) push();
        if(!saving && !pushTimer) setSync('on'); else if(!saving) setSync('on');
      } else if(first){ push(); }
      first=false;
    }, err=>{ clearTimeout(timer); docRef=null; setSync('local'); });
  }catch(e){clearTimeout(timer);setSync('local');}
}

  const name='dastarkhan-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file],title:'Dastarkhan backup'}).catch(()=>{}); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
document.addEventListener('change',e=>{
  if(e.target.id!=='importFile'||!e.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); if(j.app!=='dastarkhan'||!j.state) throw 0; const lang=state.lang; state=normalize(j.state); state.lang=lang; commit(); toast(S('imported')); }catch(err){ toast(S('badFile')); } };
  r.readAsText(e.target.files[0]);
});
function copyList(){
  const fa=L()==='fa', list=shopList(); let txt=(fa?'🛒 لست سودای هفته':'🛒 Shopping list – this week')+'\n';
  for(const [c,en,f] of CATS){ const it=list.filter(x=>x.cat===c&&!state.checked[x.id]); if(!it.length) continue; txt+=`\n*${fa?f:en}*\n`+it.map(x=>`• ${nm(ING[x.id])} – ${qty(x.id,x.q)} (${money(x.cost)})`).join('\n')+'\n'; }
  const ex=state.extra.filter(x=>!x.done); if(ex.length) txt+=`\n*${S('extra')}*\n`+ex.map(x=>'• '+x.t+(x.q?` – ${n1(+x.q)} ${exUnit(x.u)}`:'')+(x.p?` (${money(+x.p)})`:'')).join('\n')+'\n';
  txt+=`\n${fa?'تخمین':'Est.'}: ${money(list.filter(x=>!state.checked[x.id]).reduce((a,x)=>a+x.cost,0)+ex.reduce((a,x)=>a+exCost(x),0))}`;
  const fallback=()=>openSheet(`<h3>${S('copy')}</h3><p class="small muted">${S('copyManual')}</p><textarea class="copy" readonly>${esc(txt)}</textarea>`);
  try{ navigator.clipboard.writeText(txt).then(()=>toast(S('copied')),fallback); }catch(e){ fallback(); }
}

/* ---------- boot ---------- */
state=normalize(loadLocal());
try{ state.lang=localStorage.getItem(LS_LANG)||'en'; }catch(e){ state.lang='en'; }
render(); setSync('local');
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(tab==='family')render();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast(S('installed'));});
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
